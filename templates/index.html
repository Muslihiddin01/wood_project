<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Склад древесины</title>
</head>
<body>

<h1>Склад древесины</h1>

<h2>Добавить товар</h2>

<input type="text" id="name" placeholder="Название">
<input type="number" id="price" placeholder="Цена за куб">
<input type="number" id="cubes" placeholder="Количество кубов">

<button onclick="addProduct()">Добавить</button>

<hr>

<h2>Товары</h2>

<ul id="products"></ul>

<hr>

<h2>Продажа</h2>

<input type="number" id="sell_id" placeholder="ID товара">
<input type="number" id="sell_cubes" placeholder="Сколько кубов">

<button onclick="sellProduct()">Продать</button>

<script src="/static/script.js"></script>

</body>
</html>
